<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tone Zone Survivors</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none}
  /* Fixed + inset:0 tracks the visible viewport. 100vh on mobile Chrome/Safari is the height with the
     URL bar hidden, so the bottom of the canvas (dash button, bottom-tap zone) slid under the browser bar. */
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="src/sprites.js"></script>
